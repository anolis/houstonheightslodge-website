name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-prod:
    name: Docker checks and production deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, website-docker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: website-build-${{ github.sha }}
          path: ${{ runner.temp }}/website-build

      - name: Deploy using the portable Docker command
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          key_file=$(mktemp "$RUNNER_TEMP/deploy-key.XXXXXXXX")
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$PROD_SSH_KEY" > "$key_file"
          tools/deploy.sh --production --artifact "$RUNNER_TEMP/website-build" --identity "$key_file"
