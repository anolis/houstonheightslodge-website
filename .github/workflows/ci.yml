name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  pint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish tested frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: website-build-${{ github.sha }}
          path: public/build
          if-no-files-found: error
          retention-days: 7

  docker-staging:
    name: Docker staging smoke checks
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website-build-${{ github.sha }}
          path: ${{ runner.temp }}/website-build
      - name: Test the Apache/PHP container with the tested frontend bundle
        run: tools/deploy.sh --check --artifact "$RUNNER_TEMP/website-build"
      - name: Verify deployment safety gates
        run: |
          shellcheck tools/*.sh docker/deploy/*.sh docker/runner/entrypoint.sh docker/staging-entrypoint.sh
          python3 tools/test-deploy.py
